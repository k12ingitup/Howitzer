<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Howitzer — Artillery Duel</title>
<style>
  :root{
    --sky-top:#1b1430; --sky-mid:#5a3b6e; --sky-low:#c9683f;
    --sand:#e8b96b; --sand-dark:#b9853f;
    --hud:#0c0a14; --ink:#f4ecdf;
    --p1:#ff7a3c; --p2:#3ad9c4;
    --line:rgba(244,236,223,.16);
    --readout:#9af7c9; --warn:#ff5d5d;
    --accent:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  canvas{display:block;width:100%;flex:1 1 auto;touch-action:none}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    pointer-events:none;}
  .bar{flex:1 1 0;max-width:280px;background:rgba(12,10,20,.55);border:1px solid var(--line);
    border-radius:10px;padding:7px 9px;backdrop-filter:blur(6px)}
  .bar .name{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;
    display:flex;justify-content:space-between;font-weight:700}
  .hp{height:9px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:5px;overflow:hidden}
  .hp > i{display:block;height:100%;border-radius:5px;transition:width .35s ease}
  #c1 i{background:var(--p1)} #c2 i{background:var(--p2)}
  #c2{text-align:right}
  .shots-label{font-size:9px;opacity:.5;margin-top:3px;font-family:monospace;letter-spacing:.05em}
  #wind{flex:0 0 auto;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:rgba(12,10,20,.55);border:1px solid var(--line);border-radius:10px;
    padding:7px 11px;min-width:96px}
  #wind .lab{font-size:10px;letter-spacing:.18em;opacity:.65;text-transform:uppercase}
  #wind .val{font-size:15px;font-weight:700;color:var(--readout);margin-top:2px}
  #wind .sub{font-size:9px;opacity:.5;letter-spacing:.08em;margin-top:1px}
  #turnTag{position:absolute;top:70px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;
    background:rgba(12,10,20,.5);padding:4px 12px;border-radius:99px;border:1px solid var(--line);
    pointer-events:none;white-space:nowrap}

  /* Deck */
  #deck{flex:0 0 auto;background:linear-gradient(180deg,rgba(12,10,20,.4),var(--hud) 38%);
    border-top:1px solid var(--line);padding:11px 12px calc(11px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:1fr auto;gap:11px;align-items:center}
  .dials{display:flex;flex-direction:column;gap:9px;min-width:0}
  .row{display:flex;align-items:center;gap:10px}
  .row label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;width:48px;
    opacity:.7;font-weight:700;flex:0 0 auto}
  .row input[type=range]{flex:1 1 auto;-webkit-appearance:none;appearance:none;height:26px;background:transparent}
  .row input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
  .row input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;
    margin-top:-9px;border-radius:50%;background:var(--ink);border:3px solid var(--accent,#fff);
    box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .row input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:3px solid var(--accent,#fff)}
  .read{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:700;
    color:var(--readout);width:54px;text-align:right;flex:0 0 auto}
  .weps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .weps::-webkit-scrollbar{display:none}
  .wep{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.04em;padding:7px 8px;
    border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    color:var(--ink);cursor:pointer;text-align:center;line-height:1.15}
  .wep small{display:block;font-size:9px;opacity:.55;font-weight:600;letter-spacing:0}
  .wep.on{background:rgba(154,247,201,.16);border-color:var(--readout);color:#eafff4}
  #fire{grid-row:1;width:104px;height:104px;border-radius:50%;border:none;cursor:pointer;
    align-self:stretch;color:#1a0d06;font-weight:800;letter-spacing:.06em;font-size:17px;
    background:radial-gradient(circle at 38% 32%,#ffd08a,var(--p1) 64%,#c44415);
    box-shadow:0 6px 18px rgba(255,122,60,.4),inset 0 -4px 10px rgba(0,0,0,.3);
    transition:transform .07s ease,filter .2s ease;text-transform:uppercase}
  #fire:active{transform:scale(.93)}
  #fire:disabled{filter:grayscale(.7) brightness(.6);cursor:default}
  .toggles{display:flex;gap:8px;align-items:center;margin-top:1px}
  .chip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:5px 9px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--ink);cursor:pointer;opacity:.7}
  .chip.on{opacity:1;border-color:var(--readout);color:var(--readout)}

  /* Overlays */
  #overlay,#draft{position:absolute;inset:0;background:rgba(8,6,14,.88);backdrop-filter:blur(8px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:24px;z-index:20}
  #overlay h1,#draft h1{margin:0;font-size:clamp(28px,8vw,50px);font-weight:800;letter-spacing:.02em;
    background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #overlay p{margin:0;opacity:.7;max-width:340px;line-height:1.5;font-size:14px}
  #overlay .grp,#draft .grp{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .big{font-size:15px;font-weight:700;padding:13px 22px;border-radius:12px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
  .big.go{background:linear-gradient(90deg,var(--p1),#ff9d63);border:none;color:#190b04}
  .sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
  .hidden{display:none!important}

  /* Draft screen */
  #draft h2{margin:0;font-size:16px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;font-weight:700}
  .draft-cols{display:flex;gap:20px;width:100%;max-width:500px}
  .draft-col{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px}
  .draft-col-name{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .draft-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;
    max-height:220px;overflow-y:auto;scrollbar-width:none}
  .draft-col ul::-webkit-scrollbar{display:none}
  .draft-col li{font-size:12px;font-weight:700;padding:4px 6px;border-radius:6px;
    background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center}
  .draft-col li span{font-size:10px;opacity:.5;font-weight:500}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="bar">
      <div class="name"><span id="n1">Player 1</span><span id="h1">0</span></div>
      <div class="hp" id="c1"><i style="width:0%"></i></div>
      <div class="shots-label" id="shots1"></div>
    </div>
    <div id="wind">
      <div class="lab">Wind</div>
      <div class="val" id="windVal">• 0.0</div>
      <div class="sub" id="windSub">calm</div>
    </div>
    <div class="bar">
      <div class="name" style="flex-direction:row-reverse"><span id="n2">CPU</span><span id="h2">0</span></div>
      <div class="hp" id="c2"><i style="width:0%"></i></div>
      <div class="shots-label" style="text-align:right" id="shots2"></div>
    </div>
  </div>
  <div id="turnTag">Player 1 to fire</div>

  <div id="deck">
    <div class="dials">
      <div class="weps" id="weps"></div>
      <div class="row"><label>Angle</label>
        <input id="angle" type="range" min="0" max="180" value="45" step="1">
        <span class="read" id="angleR">45°</span></div>
      <div class="row"><label>Power</label>
        <input id="power" type="range" min="5" max="100" value="55" step="1">
        <span class="read" id="powerR">55</span></div>
      <div class="toggles">
        <span class="chip on" id="assistBtn">Aim assist</span>
        <span class="chip" id="menuBtn">Menu</span>
      </div>
    </div>
    <button id="fire">Fire</button>
  </div>

  <!-- Main menu -->
  <div id="overlay">
    <div class="sub">Artillery Duel</div>
    <h1>HOWITZER</h1>
    <p>Earn points by landing shots near your opponent. Most points after 10 shots wins. Each player gets a random weapon deal — pick wisely.</p>
    <div class="grp">
      <button class="big go" data-mode="cpu-easy" data-gamemode="score">vs CPU · Cadet</button>
      <button class="big go" data-mode="cpu-hard" data-gamemode="score">vs CPU · Veteran</button>
    </div>
    <div class="grp">
      <button class="big" data-mode="pvp" data-gamemode="score">2 Players · Score</button>
      <button class="big" data-mode="pvp" data-gamemode="annihilation">2 Players · Annihilation</button>
    </div>
  </div>

  <!-- Draft screen -->
  <div id="draft" class="hidden">
    <div class="sub">Weapons Dealt</div>
    <h1>YOUR ARSENAL</h1>
    <div class="draft-cols">
      <div class="draft-col">
        <div class="draft-col-name" id="draft-p1-name">Player 1</div>
        <ul id="draft-p1-weapons"></ul>
      </div>
      <div class="draft-col">
        <div class="draft-col-name" id="draft-p2-name">CPU</div>
        <ul id="draft-p2-weapons"></ul>
      </div>
    </div>
    <div class="grp">
      <button class="big go" id="draft-start">Battle!</button>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
